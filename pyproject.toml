[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-featurestore"
version = "0.1.0"
description = "A lightweight, self-hosted feature store: offline + online stores, feature registry, point-in-time correct training data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Siddharth Gaur" }]
dependencies = [
    "pandas>=1.5",
    "pyarrow>=12.0",
    "msgpack>=1.0",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
redis = ["redis>=4.5"]
duckdb = ["duckdb>=0.9"]
dev = ["pytest>=7.4", "httpx>=0.24"]

[project.scripts]
featurestore = "featurestore.cli:cli"

[tool.setuptools.packages.find]
include = ["featurestore*"]
